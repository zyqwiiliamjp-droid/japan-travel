<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本 · 私藏旅行手帖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1410;--paper:#f5f0e8;--cream:#ede8dc;--red:#c0392b;--gold:#b8860b;--muted:#8a8078;--soft:#d4c9b8;--white:#faf7f2;--accent:#6b4226;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--paper);color:var(--ink);font-family:'Noto Sans JP',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(ellipse at 20% 50%,rgba(192,57,43,.03) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(184,134,11,.04) 0%,transparent 50%);pointer-events:none;z-index:0;}
header{position:relative;z-index:10;padding:40px 60px 36px;border-bottom:1px solid var(--soft);display:flex;align-items:flex-end;justify-content:space-between;gap:24px;}
.logo-area{display:flex;flex-direction:column;gap:4px;}
.logo-kanji{font-family:'Noto Serif JP',serif;font-size:13px;font-weight:300;color:var(--muted);letter-spacing:.3em;}
.logo-main{font-family:'Cormorant Garamond',serif;font-size:clamp(26px,4vw,44px);font-weight:300;line-height:1;color:var(--ink);}
.logo-main em{font-style:italic;color:var(--red);}
.logo-sub{font-size:11px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-top:6px;}
.month-nav{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:460px;}
.month-btn{background:none;border:1px solid var(--soft);color:var(--muted);font-family:'Noto Serif JP',serif;font-size:12px;padding:6px 11px;cursor:pointer;transition:all .2s;letter-spacing:.05em;}
.month-btn:hover{border-color:var(--red);color:var(--red);}
.month-btn.active{background:var(--red);border-color:var(--red);color:#fff;}
.filter-bar{position:relative;z-index:10;padding:13px 60px;background:var(--cream);border-bottom:1px solid var(--soft);display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.filter-label{font-size:11px;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;white-space:nowrap;}
.filter-chips{display:flex;gap:7px;flex-wrap:wrap;flex:1;}
.chip{background:none;border:1px solid var(--soft);color:var(--muted);font-family:'Noto Sans JP',sans-serif;font-size:11px;padding:4px 13px;cursor:pointer;transition:all .18s;letter-spacing:.05em;}
.chip:hover{border-color:var(--gold);color:var(--gold);}
.chip.active{background:var(--gold);border-color:var(--gold);color:#fff;}
.search-wrap{position:relative;}
.search-input{background:var(--white);border:1px solid var(--soft);color:var(--ink);font-family:'Noto Sans JP',sans-serif;font-size:12px;padding:6px 14px 6px 30px;width:200px;outline:none;transition:border-color .2s;}
.search-input:focus{border-color:var(--gold);}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;pointer-events:none;}
.season-banner{position:relative;z-index:5;padding:20px 60px;display:flex;align-items:center;gap:20px;}
.season-illus{flex-shrink:0;width:64px;height:64px;}
.season-info h2{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:300;color:var(--ink);letter-spacing:.04em;}
.season-info p{font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:.05em;}
.season-count{margin-left:auto;text-align:right;}
.season-count .num{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:300;color:var(--red);line-height:1;}
.season-count .lbl{font-size:10px;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;}
.divider{display:flex;align-items:center;gap:16px;padding:0 60px;}
.divider-line{flex:1;height:1px;background:var(--soft);}
.divider-mark{font-size:13px;color:var(--soft);}
main{position:relative;z-index:5;padding:28px 60px 80px;columns:3;column-gap:20px;}
@media(max-width:1100px){main{columns:2;}}
@media(max-width:680px){main{columns:1;padding:20px;}header{padding:28px 20px;flex-direction:column;align-items:flex-start;}.filter-bar,.season-banner,.divider{padding-left:20px;padding-right:20px;}.month-nav{justify-content:flex-start;}}
.card{break-inside:avoid;margin-bottom:18px;background:var(--white);border:1px solid var(--soft);cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;opacity:0;animation:fadeUp .32s ease forwards;}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(26,20,16,.11);border-color:var(--gold);}
.card:active{transform:translateY(-1px);}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.card-inner{padding:18px 20px;}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;}
.card-title{font-family:'Noto Serif JP',serif;font-size:14px;font-weight:400;color:var(--ink);line-height:1.5;flex:1;}
.map-hint{font-size:10px;color:var(--muted);letter-spacing:.05em;flex-shrink:0;margin-top:3px;opacity:.65;white-space:nowrap;}
.card-type{font-size:10px;color:var(--muted);letter-spacing:.1em;background:var(--cream);padding:2px 8px;display:inline-block;margin-bottom:8px;}
.card-rating{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
.stars{display:flex;gap:1px;}
.star{color:var(--gold);font-size:11px;}
.star.e{color:var(--soft);}
.rating-val{font-size:12px;color:var(--muted);font-family:'Cormorant Garamond',serif;}
.rating-count{font-size:10px;color:var(--soft);}
.card-address{font-size:11px;color:var(--muted);margin-bottom:4px;line-height:1.5;}
.card-memo{margin-top:11px;padding:9px 12px;background:rgba(184,134,11,.06);border-left:2px solid var(--gold);font-size:12px;color:var(--accent);line-height:1.8;white-space:pre-wrap;font-family:'Noto Serif JP',serif;}
.memo-label{font-size:9px;letter-spacing:.15em;color:var(--gold);margin-bottom:4px;font-family:'Noto Sans JP',sans-serif;display:block;}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.sk{background:linear-gradient(90deg,var(--cream) 0,var(--soft) 80px,var(--cream) 160px);background-size:400px;animation:shimmer 1.4s infinite linear;border-radius:2px;display:block;height:10px;margin-bottom:7px;}
.empty-state{text-align:center;padding:80px 24px;color:var(--muted);}
.empty-kanji{font-family:'Noto Serif JP',serif;font-size:48px;opacity:.25;display:block;margin-bottom:14px;}
.watermark{position:fixed;bottom:28px;right:36px;font-family:'Cormorant Garamond',serif;font-size:11px;color:var(--soft);letter-spacing:.1em;z-index:1;writing-mode:vertical-rl;}
</style>
</head>

</header>

const SEASONS={
  1:{name:"一月 · 睦月",sub:"冬雪寒梅 · 腊梅飘香"},
  2:{name:"二月 · 如月",sub:"红梅初绽 · 节分豆撒"},
  3:{name:"三月 · 弥生",sub:"樱花前线 · 修二会法要"},
  4:{name:"四月 · 卯月",sub:"樱花盛放 · 花见最佳"},
  5:{name:"五月 · 皐月",sub:"藤花紫浪 · 新绿涌动"},
  6:{name:"六月 · 水無月",sub:"梅雨绣球 · 古代莲池"},
  7:{name:"七月 · 文月",sub:"祇园祭典 · 向日葵田"},
  8:{name:"八月 · 葉月",sub:"盂兰盆节 · 灯笼流放"},
  9:{name:"九月 · 長月",sub:"曼珠沙华 · 秋高气爽"},
  10:{name:"十月 · 神無月",sub:"枫红初染 · 美术馆季"},
  11:{name:"十一月 · 霜月",sub:"红叶深浓 · 火渡护摩"},
  12:{name:"十二月 · 師走",sub:"若宫祭典 · 密佛公开"}
};

let currentMonth=new Date().getMonth()+1,activeArea='all',searchTerm='';
const cache={};

document.addEventListener('DOMContentLoaded',()=>{
  document.querySelectorAll('.month-btn').forEach(b=>b.addEventListener('click',()=>setMonth(+b.dataset.month)));
  document.getElementById('searchInput').addEventListener('input',e=>{searchTerm=e.target.value.toLowerCase();renderGrid();});
  setMonth(currentMonth);
});

function setMonth(m){
  currentMonth=m; activeArea='all'; searchTerm='';
  document.getElementById('searchInput').value='';
  document.querySelectorAll('.month-btn').forEach(b=>b.classList.toggle('active',+b.dataset.month===m));
  (PLACES_DATA[String(m)]||[]).forEach(p=>{
    if(cache[p.title]===undefined){const g=guessType(p.title);if(g)cache[p.title]={type:g};}
  });
  updateBanner(); renderChips(); renderGrid();
  fetchUncachedForMonth(m);
}

function updateBanner(){
  const s=SEASONS[currentMonth],count=(PLACES_DATA[String(currentMonth)]||[]).length;
  document.getElementById('seasonBanner').innerHTML=
    '<div class="season-illus">'+SEASON_SVG[currentMonth]+'</div>'+
    '<div class="season-info"><h2>'+s.name+'</h2><p>'+s.sub+'</p></div>'+
    '<div class="season-count"><div class="num">'+count+'</div><div class="lbl">处私藏</div></div>';
}

function renderChips(){
  const places=PLACES_DATA[String(currentMonth)]||[],types=new Set();
  places.forEach(p=>{if(cache[p.title]&&cache[p.title].type)types.add(cache[p.title].type);});
  const el=document.getElementById('filterChips');
  el.innerHTML='';
  appendChip(el,'全部','all');
  [...types].sort().forEach(t=>appendChip(el,t,t));
  if(activeArea!=='all'&&!types.has(activeArea))activeArea='all';
  el.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.area===activeArea));
}

function appendChip(container,label,area){
  const btn=document.createElement('button');
  btn.className='chip'; btn.dataset.area=area; btn.textContent=label;
  btn.addEventListener('click',()=>{activeArea=area;renderChips();renderGrid();});
  container.appendChild(btn);
}

function renderGrid(){
  const grid=document.getElementById('mainGrid');
  const places=PLACES_DATA[String(currentMonth)]||[];
  const list=places.filter(p=>{
    const tm=!searchTerm||p.title.toLowerCase().includes(searchTerm)||(p.memo||'').toLowerCase().includes(searchTerm);
    const am=activeArea==='all'||(cache[p.title]&&cache[p.title].type===activeArea);
    return tm&&am;
  });
  if(!list.length){grid.innerHTML='<div class="empty-state"><span class="empty-kanji">無</span>暂无符合条件的地点</div>';return;}
  grid.innerHTML='';
  list.forEach((place,i)=>{const card=buildCard(place,i);grid.appendChild(card);});
}

function buildCard(place,idx){
  const card=document.createElement('div');
  card.className='card'; card.style.animationDelay=(idx*.03)+'s';
  card.addEventListener('click',()=>window.open(place.url,'_blank'));
  fillCard(card,place); return card;
}

function fillCard(card,place){
  const info=cache[place.title];
  const memoHtml=(place.memo&&place.memo.trim())
    ?'<div class="card-memo"><span class="memo-label">私藏笔记</span>'+esc(place.memo)+'</div>':'';
  const infoHtml=(info===undefined)
    ?'<div class="sk" style="width:42%"></div><div class="sk" style="width:66%"></div><div class="sk" style="width:36%"></div>'
    :buildInfoHtml(info);
  card.innerHTML='<div class="card-inner"><div class="card-header"><div class="card-title">'+esc(place.title)+'</div><span class="map-hint">🗺 查看地图</span></div>'+infoHtml+memoHtml+'</div>';
}

function buildInfoHtml(info){
  let h='';
  if(info.type)h+='<div class="card-type">'+esc(info.type)+'</div>';
  if(info.rating)h+=starsHtml(info.rating,info.ratingCount);
  if(info.address)h+='<div class="card-address">📍 '+esc(info.address)+'</div>';
  return h;
}

function starsHtml(rStr,cStr){
  const r=parseFloat(rStr)||0,full=Math.floor(r),half=(r-full>=.5)?1:0,empty=5-full-half;
  return '<div class="card-rating"><div class="stars">'+'<span class="star">★</span>'.repeat(full)+(half?'<span class="star" style="opacity:.5">★</span>':'')+'<span class="star e">☆</span>'.repeat(empty)+'</div><span class="rating-val">'+r.toFixed(1)+'</span>'+(cStr?'<span class="rating-count">('+esc(String(cStr))+')</span>':'')+'</div>';
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function fetchUncachedForMonth(month){
  const places=PLACES_DATA[String(month)]||[];
  const todo=places.filter(p=>cache[p.title]===undefined);
  if(!todo.length)return;
  const BATCH=8;
  for(let i=0;i<todo.length;i+=BATCH){
    if(currentMonth!==month)return;
    await fetchBatch(todo.slice(i,i+BATCH),month);
    if(i+BATCH<todo.length)await sleep(400);
  }
}

async function fetchBatch(places,month){
  const titles=places.map(p=>p.title);
  try{
    const res=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:'Japan travel info assistant. Given a JSON array of place names, return a JSON array (same order, same length) where each element is: {"type":"寺社|神社|公園|海岸|展望台|美術館|温泉|グルメ|城跡|橋|自然|街並み","rating":"4.2","ratingCount":"1.2k","address":"very short e.g. 東京都台東区"}. Use null for unknown. Reply ONLY with the JSON array.',
        messages:[{role:'user',content:JSON.stringify(titles)}]
      })
    });
    const data=await res.json();
    const raw=(data.content&&data.content[0]&&data.content[0].text)||'[]';
    let arr=[];
    try{arr=JSON.parse(raw.replace(/```[a-z]*/gi,'').replace(/```/g,'').trim());}catch(e){}
    if(!Array.isArray(arr))arr=[];
    places.forEach((place,idx)=>{
      const info=arr[idx]||{};
      if(!info.type&&cache[place.title]&&cache[place.title].type)info.type=cache[place.title].type;
      cache[place.title]=info;
    });
  }catch(e){
    places.forEach(p=>{if(cache[p.title]===undefined)cache[p.title]={};});
  }
  if(currentMonth===month){renderChips();renderGrid();}
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
</script>
